<ion-header>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button
        (click)="confirm()"
        [disabled]="!item.description"
        [strong]="true"
        >Hecho</ion-button
      >
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <!-- Primera fila -->
    <ion-row>
      <ion-col>
        <ion-item lines="none">
          <ion-input
            label="Nombre"
            [(ngModel)]="item.description"
            placeholder="Nombre del producto"
            class="ion-text-right"
          ></ion-input>
        </ion-item>
      </ion-col>
    </ion-row>

    <!-- Segunda fila -->
    <ion-row>
      <!-- Primera celda -->
      <ion-col>
        <ion-item lines="none">
          <ion-input
            label="Cantidad"
            type="number"
            [(ngModel)]="item.quantity"
            min="1"
            inputmode="tel"
            class="ion-text-right"
          ></ion-input>
        </ion-item>
      </ion-col>
      <!-- Segunda celda -->
      <ion-col>
        <ion-item lines="none">
          <ion-select placeholder="Unidad" [(ngModel)]="item.unit">
            @for (unit of units(); track unit.id) {
            <ion-select-option [value]="unit.id">
              {{ unit.description }}
            </ion-select-option>
            }
          </ion-select>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
