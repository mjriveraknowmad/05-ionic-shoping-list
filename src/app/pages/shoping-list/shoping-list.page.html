<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi lista de la compra</ion-title>
    <ion-item slot="end" color="transparent" lines="none">
      <ion-icon name="add-outline" (click)="openModal()" />
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
 @for (groupItems of groupItems(); track groupItems.name) {
  <ion-item-group>
    <ion-item-divider>
      <ion-label>{{ groupItems.name }}</ion-label>
    </ion-item-divider>

    @for (item of groupItems.items; track item.id) {
      <ion-item lines="none">
        <ion-button slot="start" fill="clear">
          <ion-checkbox slot="start" [(ngModel)]="item.checked" (ionChange)="updateItem(item)"></ion-checkbox>
        </ion-button>
        <ion-text>{{ item.quantity }} {{item.unit?.description }} {{ item.description }}</ion-text>
        <ion-icon name="close-outline" slot="end" (click)="deleteItem(item)"></ion-icon>
      </ion-item>
    }

  </ion-item-group>
}
<!-- El ion-button envuelve el ion-checkbox para que al pulsar en el listo de la fila no se active el checkbox por error.
Esto permite que solo al pulsar directamente sobre el checkbox se cambie su estado. -->
</ion-content>
