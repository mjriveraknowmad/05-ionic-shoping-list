<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mi lista de la compra</ion-title>
    <ion-item slot="end" color="transparent" lines="none">
      <ion-icon name="add-outline" (click)="openModal()" />
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <p>Pendientes:</p>
  <pre style="max-height: 200px; overflow: auto;">
    {{ groupItems()[0] | json }}
  </pre>
  <p>Completados:</p>
  <pre style="max-height: 200px; overflow: auto;">
    {{ groupItems()[1] | json }}
  </pre>
</ion-content>
